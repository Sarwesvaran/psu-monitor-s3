; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200

; --- MAXIMIZE HARDWARE PERFORMANCE ---
board_build.f_cpu = 240000000L   ; Force CPU to 240MHz
board_build.f_flash = 80000000L  ; Force Flash to 80MHz
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_src_filter = +<main.cpp>
; --- ENABLE PSRAM & USB CDC ---
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -O3                          ; Force maximum compiler optimization for math

lib_deps =
    teenagex/ST7789@^0.9.6
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.9
    4-20ma/ModbusMaster@^2.0.1